name: Test Coverage

on:
  push:
  pull_request:

jobs:
  test-coverage:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        framework: [net8.0, net10.0]
        include:
          - os: windows-latest
            framework: net48

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      - name: Run Tests with Code Coverage
        run: dotnet test --configuration Release --no-build -f ${{ matrix.framework }} --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Generate Coverage Summary Report
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both

      - name: Publish Coverage to GitHub Step Summary
        if: matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
